spring.application.name=PdfBackend
server.port=${PORT:8080}
spring.data.mongodb.uri=${MONGODB_URI}



jwt.secret=${JWT_SECRET:}
jwt.expiration=86400000
openrouter.api.key=${OPENROUTER_API_KEY:}
#actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never

# Allow actuator from browser
management.endpoints.web.cors.allowed-origins=http://localhost:5173,http://localhost:8080
management.endpoints.web.cors.allowed-methods=GET

#admin
spring.config.import=optional:file:./application-secrets.properties

app.admins[0].name=${APP_ADMIN1_NAME:Admin One}
app.admins[0].roll-number=${APP_ADMIN1_ROLL:ADMIN001}
app.admins[0].password=${APP_ADMIN1_PASSWORD:change-me-1}

app.admins[1].name=${APP_ADMIN2_NAME:Admin Two}
app.admins[1].roll-number=${APP_ADMIN2_ROLL:ADMIN002}
app.admins[1].password=${APP_ADMIN2_PASSWORD:change-me-2}